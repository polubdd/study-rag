<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>study-rag</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  :root {
    --bg:#f6f5f2; --fg:#1d1c1a; --muted:#78746c; --line:#e5e2dc; --card:#ffffff; --raised:#fbfaf8;
    --accent:#4f46e5; --accent-soft:#eef0ff; --ok:#15803d; --bad:#b42318; --mark:#fff2b3;
    --radius:12px; --shadow:0 1px 2px rgba(20,18,15,.04), 0 4px 16px rgba(20,18,15,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111110; --fg:#ecebe7; --muted:#9e9a92; --line:#2b2a27; --card:#191917; --raised:#1f1f1c;
            --accent:#a5b4fc; --accent-soft:#25273d; --ok:#4ade80; --bad:#f87171; --mark:#4a3f12; --shadow:none; }
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width:860px; margin:0 auto; padding:32px 16px 96px; }
  button, input, select, textarea { font:inherit; color:inherit; }

  header { display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
  .brand { display:flex; align-items:baseline; gap:10px; }
  .brand h1 { font-size:20px; margin:0; letter-spacing:-.01em; }
  .brand span { color:var(--muted); font-size:14px; }
  .course { display:flex; gap:8px; }
  select, input[type=text], textarea {
    background:var(--card); border:1px solid var(--line); border-radius:10px; padding:9px 12px; outline:none;
  }
  select:focus, input:focus, textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .btn { display:inline-flex; align-items:center; gap:6px; padding:9px 14px; border-radius:10px; border:1px solid var(--line);
         background:var(--card); cursor:pointer; white-space:nowrap; transition:border-color .15s, background .15s; }
  .btn:hover { border-color:var(--muted); }
  .btn.primary { background:var(--fg); color:var(--bg); border-color:var(--fg); }
  .btn.ghost { border-color:transparent; background:transparent; color:var(--muted); padding:6px 10px; }
  .btn.ghost:hover { color:var(--fg); background:var(--raised); }
  .btn:disabled { opacity:.5; cursor:default; }

  nav { display:flex; gap:2px; margin:24px 0 20px; border-bottom:1px solid var(--line); overflow-x:auto; }
  nav button { border:0; background:none; padding:10px 14px; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent;
               margin-bottom:-1px; white-space:nowrap; }
  nav button.on { color:var(--fg); border-bottom-color:var(--fg); }
  .badge { display:inline-block; min-width:20px; padding:0 6px; margin-left:6px; border-radius:99px; background:var(--accent);
           color:var(--bg); font-size:12px; line-height:20px; text-align:center; }

  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); }
  .muted { color:var(--muted); font-size:14px; }
  .hidden { display:none !important; }
  .err { color:var(--bad); font-size:14px; }

  /* --- вопрос */
  .ask { display:flex; gap:8px; }
  .ask input { flex:1; padding:12px 14px; font-size:16px; }
  .examples { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .chip { border:1px solid var(--line); background:var(--card); border-radius:99px; padding:3px 12px; font-size:13px; color:var(--muted); cursor:pointer; }
  .chip:hover { color:var(--fg); border-color:var(--muted); }
  .answer { margin-top:20px; padding:20px 22px; }
  .answer .body { font-size:17px; line-height:1.75; }
  .answer .meta { margin-top:12px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .pill { font-size:12px; padding:2px 10px; border-radius:99px; background:var(--raised); border:1px solid var(--line); color:var(--muted); }
  .warn { color:var(--bad); font-size:14px; margin-top:8px; }
  .cite { display:inline-block; min-width:20px; padding:0 6px; margin:0 2px; border-radius:6px; background:var(--accent-soft); color:var(--accent);
          font-size:12px; font-weight:600; line-height:20px; text-align:center; cursor:pointer; vertical-align:2px; }
  .sources { margin-top:20px; display:grid; gap:10px; }
  .src { padding:14px 16px; border-left:3px solid transparent; transition:border-color .2s, background .2s; }
  .src.hl { border-left-color:var(--accent); background:var(--accent-soft); }
  .src .head { display:flex; gap:10px; align-items:baseline; justify-content:space-between; }
  .src .title { font-weight:600; font-size:15px; }
  .src .title b { color:var(--accent); margin-right:6px; }
  .src .doc { color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:40%; }
  .src .text { margin-top:6px; font-size:15px; line-height:1.65; color:var(--fg); }
  .src .text.clamp { display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
  .src .more { margin-top:4px; }
  mark { background:var(--mark); color:inherit; border-radius:3px; padding:0 1px; }

  /* --- формулы */
  sup, sub { font-size:.72em; line-height:0; }
  .katex { font-size:1.05em; }
  .katex-display { margin:.4em 0; overflow-x:auto; overflow-y:hidden; }

  /* --- повторение */
  .stats { display:flex; gap:20px; flex-wrap:wrap; font-size:14px; color:var(--muted); margin-bottom:14px; }
  .stats b { color:var(--fg); font-weight:600; }
  .flash { min-height:260px; padding:32px 28px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; gap:16px; }
  .flash .front { font-size:22px; font-weight:600; line-height:1.4; }
  .flash .back { font-size:17px; line-height:1.7; max-width:640px; text-align:left; }
  .flash .src-line { font-size:13px; color:var(--muted); }
  .grades { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; margin-top:12px; }
  .grades .btn { flex-direction:column; justify-content:center; padding:10px 6px; gap:0; }
  .grades small { color:var(--muted); font-size:12px; }
  .hint { text-align:center; margin-top:14px; }
  kbd { font:12px ui-monospace, Consolas, monospace; border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:0 5px; background:var(--card); }

  /* --- квиз */
  .quiz { padding:24px; }
  .quiz .q { font-size:18px; line-height:1.7; margin:10px 0 18px; }
  .opt { display:block; width:100%; text-align:left; margin-top:8px; padding:12px 14px; }
  .opt.right { border-color:var(--ok); color:var(--ok); }
  .opt.wrong { border-color:var(--bad); color:var(--bad); }
  .progress { height:4px; background:var(--line); border-radius:4px; overflow:hidden; }
  .progress i { display:block; height:100%; background:var(--accent); transition:width .3s; }

  /* --- материалы */
  .drop { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:32px 16px; border:2px dashed var(--line);
          border-radius:var(--radius); background:var(--card); color:var(--muted); text-align:center; cursor:pointer; transition:border-color .15s, color .15s; }
  .drop:hover, .drop.over { border-color:var(--accent); color:var(--accent); }
  .drop strong { color:var(--fg); font-weight:600; }
  .drop.over strong { color:var(--accent); }
  .docs { margin-top:16px; }
  .doc { display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); }
  .doc:last-child { border-bottom:0; }
  .doc .ext { flex:none; width:40px; height:40px; border-radius:10px; background:var(--raised); border:1px solid var(--line);
              display:grid; place-items:center; font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; }
  .doc .name { flex:1; min-width:0; }
  .doc .name div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .doc .actions { display:flex; gap:2px; flex:none; }
  .viewer { margin-top:16px; padding:20px 22px; }
  .viewer h2 { font-size:18px; margin:18px 0 6px; } .viewer h3 { font-size:16px; margin:14px 0 4px; } .viewer h4 { font-size:15px; margin:12px 0 4px; }
  .viewer h2:first-child { margin-top:0; }
  .viewer p { margin:6px 0; }
  h3.section { font-size:15px; margin:32px 0 6px; }
  textarea { width:100%; min-height:96px; resize:vertical; }

  @media (max-width:560px) {
    main { padding:20px 16px 80px; }
    .grades { grid-template-columns:repeat(2, 1fr); }
    .doc .actions .btn span { display:none; }
    .src .doc { display:none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="brand"><h1>Конспекты</h1><span id="status"></span></div>
    <div class="course">
      <select id="course" aria-label="Курс"></select>
      <button class="btn" id="newCourse">+ курс</button>
    </div>
  </header>

  <nav>
    <button data-tab="ask" class="on">Спросить</button>
    <button data-tab="review">Повторение<span class="badge hidden" id="dueBadge"></span></button>
    <button data-tab="quiz">Квиз</button>
    <button data-tab="docs">Материалы</button>
  </nav>

  <section id="tab-ask">
    <form class="ask" id="askForm">
      <input type="text" id="q" placeholder="Что такое метрическое пространство?" autocomplete="off">
      <button class="btn primary">Спросить</button>
    </form>
    <div class="examples" id="examples"></div>
    <div id="answer"></div>
  </section>

  <section id="tab-review" class="hidden">
    <div class="stats" id="stats"></div>
    <div class="card flash" id="flash"></div>
    <div class="grades hidden" id="grades">
      <button class="btn" data-g="0">Не помню<small>10 мин</small></button>
      <button class="btn" data-g="1">Трудно<small id="g1"></small></button>
      <button class="btn" data-g="2">Хорошо<small id="g2"></small></button>
      <button class="btn" data-g="3">Легко<small id="g3"></small></button>
    </div>
    <p class="muted hint"><kbd>пробел</kbd> показать ответ · <kbd>1</kbd>–<kbd>4</kbd> оценка</p>
  </section>

  <section id="tab-quiz" class="hidden">
    <div class="card quiz" id="quiz"></div>
  </section>

  <section id="tab-docs" class="hidden">
    <label class="drop" id="drop">
      <strong>Перетащите конспекты сюда</strong>
      <span>или нажмите, чтобы выбрать · .md, .txt, .docx, .pdf</span>
      <input type="file" id="files" multiple accept=".md,.markdown,.txt,.docx,.pdf" class="hidden">
    </label>
    <div id="uploadMsg" class="muted" style="margin-top:10px"></div>
    <div class="card docs" id="docs"></div>
    <div id="viewer"></div>

    <h3 class="section">Синонимы курса</h3>
    <p class="muted" style="margin:0 0 8px">По одной группе на строку, через запятую: <i>матожидание, среднее, E[X]</i>. Поиск будет считать их одним словом.</p>
    <textarea id="syn"></textarea>
    <div style="margin-top:8px"><button class="btn" id="saveSyn">Сохранить</button> <span class="muted" id="synMsg"></span></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api = async (url, opts = {}) => {
  const r = await fetch(url, { headers: opts.body && !(opts.body instanceof FormData) ? { "Content-Type": "application/json" } : {}, ...opts });
  if (r.status === 204) return null;
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof d.detail === "string" ? d.detail : "ошибка запроса");
  return d;
};
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } },
                 set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

// ---------- отрисовка текста конспекта: формулы, индексы, жирный, ссылки
function inlineMarkup(s) {
  // s уже экранирован. ^{…} и _{…} из PDF — индексы и степени (допускаю одну вложенность скобок)
  const group = "((?:[^{}]|\\{[^{}]*\\})*)";
  for (let i = 0; i < 2; i++) {
    s = s.replace(new RegExp("\\^\\{" + group + "\\}", "g"), "<sup>$1</sup>")
         .replace(new RegExp("_\\{" + group + "\\}", "g"), "<sub>$1</sub>");
  }
  return s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
}
function katexOr(tex, display) {
  if (window.katex) {
    try { return katex.renderToString(tex, { displayMode: display, throwOnError: false, strict: "ignore" }); } catch {}
  }
  return `<code>${esc(tex)}</code>`;
}
function rich(text, { cites = false, highlight = null } = {}) {
  // LaTeX из markdown-конспектов: $$…$$ и $…$ рендерит KaTeX, остальное — экранированный текст
  const parts = String(text ?? "").split(/(\$\$[\s\S]+?\$\$|\$[^$\n]+?\$)/g);
  let html = parts.map(p => {
    if (p.startsWith("$$") && p.endsWith("$$") && p.length > 4) return katexOr(p.slice(2, -2), true);
    if (p.startsWith("$") && p.endsWith("$") && p.length > 2) return katexOr(p.slice(1, -1), false);
    let h = inlineMarkup(esc(p));
    if (highlight) h = highlightTerms(h, highlight);
    return h;
  }).join("");
  if (cites) html = html.replace(/\[(\d+)\]/g, '<span class="cite" data-n="$1" title="Показать источник">$1</span>');
  return html.replace(/\n/g, "<br>");
}
function highlightTerms(html, words) {
  // подсвечиваю слова вопроса по основе (первые 5 букв), не трогая HTML-теги
  const stems = words.filter(w => w.length > 3).map(w => w.toLowerCase().replace(/ё/g, "е").slice(0, Math.max(4, Math.min(6, w.length - 2))));
  if (!stems.length) return html;
  const re = new RegExp("(^|[^а-яёa-z])(" + stems.map(s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")([а-яёa-z]*)", "gi");
  return html.split(/(<[^>]+>)/).map(part => part.startsWith("<") ? part : part.replace(re, "$1<mark>$2$3</mark>")).join("");
}
function markdownView(md) {
  // простой просмотр документа: заголовки, абзацы, формулы
  return md.split(/\n{2,}/).map(block => {
    const h = block.match(/^(#{1,4})\s+(.*)$/);
    if (h) return `<h${h[1].length + 1}>${rich(h[2])}</h${h[1].length + 1}>`;
    return `<p>${rich(block)}</p>`;
  }).join("");
}

// ---------- курсы и вкладки
let course = null, tab = "ask", queue = [], cur = null, shown = false;

async function loadCourses(select) {
  const cs = await api("/api/courses");
  $("course").innerHTML = cs.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join("");
  course = select ?? cs.find(c => String(c.id) === store.get("course"))?.id ?? cs[0]?.id;
  $("course").value = course;
  refreshBadge();
  openTab(tab);
}
$("course").onchange = () => { course = +$("course").value; store.set("course", course); $("answer").innerHTML = ""; refreshBadge(); openTab(tab); };
$("newCourse").onclick = async () => {
  const name = prompt("Название курса");
  if (!name) return;
  try { const r = await api("/api/courses", { method: "POST", body: JSON.stringify({ name }) }); store.set("course", r.id); await loadCourses(r.id); openTab("docs"); }
  catch (e) { alert(e.message); }
};
document.querySelectorAll("nav button").forEach(b => b.onclick = () => openTab(b.dataset.tab));
function openTab(t) {
  tab = t;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  document.querySelectorAll("main > section").forEach(s => s.classList.toggle("hidden", s.id !== "tab-" + t));
  if (t === "review") startReview();
  if (t === "quiz") startQuiz();
  if (t === "docs") loadDocs();
  if (t === "ask") { $("q").focus(); loadExamples(); }
}
async function refreshBadge() {
  if (!course) return;
  const p = await api(`/api/courses/${course}/progress`);
  $("dueBadge").textContent = p.due;
  $("dueBadge").classList.toggle("hidden", !p.due);
  return p;
}
api("/api/status").then(s => { $("status").textContent = s.llm ? "· LLM подключена" : ""; });

// ---------- вопрос
async function loadExamples() {
  // примеры вопросов — из карточек курса, чтобы было видно, что вообще можно спросить
  const cards = await api(`/api/courses/${course}/cards?limit=200`).catch(() => []);
  const qs = cards.filter(c => c.kind === "definition").map(c => c.front).sort(() => Math.random() - .5).slice(0, 4);
  $("examples").innerHTML = qs.map(q => `<button class="chip">${rich(q)}</button>`).join("");
  $("examples").querySelectorAll(".chip").forEach((b, i) => b.onclick = () => { $("q").value = qs[i]; $("askForm").requestSubmit(); });
}
$("askForm").onsubmit = async e => {
  e.preventDefault();
  const question = $("q").value.trim();
  if (!question) return;
  $("answer").innerHTML = '<p class="muted" style="margin-top:20px">Ищу в конспектах…</p>';
  try {
    const a = await api(`/api/courses/${course}/ask`, { method: "POST", body: JSON.stringify({ question }) });
    const words = question.split(/[^а-яёa-z0-9]+/i);
    const mode = { llm: "ответ LLM по конспекту", extractive: "дословно из конспекта" }[a.mode];
    let html = `<div class="card answer"><div class="body">${rich(a.text, { cites: true })}</div>
      <div class="meta">${mode ? `<span class="pill">${mode}</span>` : ""}</div>
      ${a.warnings.map(w => `<div class="warn">${esc(w)}</div>`).join("")}</div>`;
    if (a.mode !== "none") {
      html += `<div class="sources">` + a.sources.map(s => {
        const path = s.section.split(" / ");
        return `<div class="card src" id="src-${s.n}">
          <div class="head"><div class="title"><b>${s.n}</b>${rich(path.slice(-1)[0])}</div><div class="doc" title="${esc(s.source)}">${esc(s.source)}</div></div>
          ${path.length > 1 ? `<div class="muted" style="font-size:12px">${rich(path.slice(0, -1).join(" › "))}</div>` : ""}
          <div class="text clamp">${rich(s.text, { highlight: words })}</div>
          <button class="btn ghost more">Показать полностью</button></div>`;
      }).join("") + `</div>`;
    }
    $("answer").innerHTML = html;
    document.querySelectorAll(".src").forEach(src => {
      const text = src.querySelector(".text"), more = src.querySelector(".more");
      if (text.scrollHeight <= text.clientHeight + 4) more.classList.add("hidden");
      more.onclick = () => { const open = text.classList.toggle("clamp"); more.textContent = open ? "Показать полностью" : "Свернуть"; };
    });
    document.querySelectorAll(".cite").forEach(c => c.onclick = () => {
      document.querySelectorAll(".src").forEach(s => s.classList.remove("hl"));
      const el = $("src-" + c.dataset.n);
      if (el) { el.classList.add("hl"); el.querySelector(".text").classList.remove("clamp"); el.scrollIntoView({ behavior: "smooth", block: "center" }); }
    });
  } catch (err) { $("answer").innerHTML = `<p class="err" style="margin-top:20px">${esc(err.message)}</p>`; }
};

// ---------- повторение
function nextInterval(c, g) {
  if (c.reps === 0) return [1, 1, 3][g - 1];
  if (c.reps === 1) return [2, 3, 5][g - 1];
  const ease = Math.max(1.3, c.ease + [-0.15, 0, 0.15][g - 1]);
  return Math.round(Math.max(c.interval + 1, c.interval * [1.2, ease, ease * 1.3][g - 1]));
}
const days = d => d % 10 === 1 && d % 100 !== 11 ? `${d} день` : [2, 3, 4].includes(d % 10) && ![12, 13, 14].includes(d % 100) ? `${d} дня` : `${d} дней`;
async function startReview() {
  const p = await refreshBadge();
  $("stats").innerHTML = `<span>новых <b>${p.new}</b></span><span>изучаю <b>${p.learning}</b></span><span>выучено <b>${p.mature}</b></span>` +
    (p.reviews_7d ? `<span>за неделю ${p.reviews_7d} повторений, вспомнил <b>${Math.round(p.recall_7d * 100)}%</b></span>` : "");
  queue = await api(`/api/courses/${course}/cards?due=true&limit=50`);
  showCard();
}
function showCard() {
  cur = queue.shift();
  shown = false;
  $("grades").classList.add("hidden");
  if (!cur) {
    $("flash").innerHTML = `<div class="front">На сегодня всё</div><div class="muted">Карточки вернутся, когда подойдёт время повторения.</div>`;
    return;
  }
  $("flash").innerHTML = `<div class="front">${rich(cur.front)}</div><button class="btn" id="show">Показать ответ</button>`;
  $("show").onclick = reveal;
}
function reveal() {
  if (!cur || shown) return;
  shown = true;
  $("flash").innerHTML = `<div class="muted">${rich(cur.front)}</div><div class="back">${rich(cur.back)}</div>`;
  [1, 2, 3].forEach(g => $("g" + g).textContent = days(nextInterval(cur, g)));
  $("grades").classList.remove("hidden");
}
async function grade(g) {
  if (!cur || !shown) return;
  const updated = await api(`/api/cards/${cur.id}/review`, { method: "POST", body: JSON.stringify({ grade: g }) });
  if (g === 0) queue.push(updated);  // забытая карточка вернётся в конце сессии
  refreshBadge();
  showCard();
}
document.querySelectorAll("#grades button").forEach(b => b.onclick = () => grade(+b.dataset.g));
document.addEventListener("keydown", e => {
  if (tab !== "review" || ["INPUT", "TEXTAREA", "SELECT"].includes(e.target.tagName)) return;
  if (e.code === "Space") { e.preventDefault(); reveal(); }
  if (["1", "2", "3", "4"].includes(e.key)) grade(+e.key - 1);
});

// ---------- квиз
let quizItems = [], qi = 0, score = 0;
async function startQuiz() {
  quizItems = await api(`/api/courses/${course}/quiz?n=10`);
  qi = 0; score = 0;
  if (!quizItems.length) { $("quiz").innerHTML = '<p class="muted">Для квиза нужно хотя бы 4 определения в конспектах.</p>'; return; }
  showQuestion();
}
function showQuestion() {
  const bar = `<div class="progress"><i style="width:${100 * qi / quizItems.length}%"></i></div>`;
  if (qi >= quizItems.length) {
    $("quiz").innerHTML = bar + `<div style="text-align:center;padding:24px 0"><div style="font-size:28px;font-weight:600">${score} из ${quizItems.length}</div>
      <button class="btn" id="again" style="margin-top:14px">Ещё раз</button></div>`;
    $("again").onclick = startQuiz;
    return;
  }
  const it = quizItems[qi];
  $("quiz").innerHTML = bar + `<div class="muted" style="margin-top:12px">Вопрос ${qi + 1} из ${quizItems.length} · какое понятие пропущено?</div>
    <div class="q">${rich(it.prompt)}</div>` + it.options.map((o, i) => `<button class="btn opt" data-i="${i}">${rich(o)}</button>`).join("");
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    document.querySelectorAll(".opt").forEach(x => { x.disabled = true; if (+x.dataset.i === it.answer) x.classList.add("right"); });
    if (i === it.answer) score++; else b.classList.add("wrong");
    setTimeout(() => { qi++; showQuestion(); }, i === it.answer ? 700 : 1600);
  });
}

// ---------- материалы
async function loadDocs() {
  const docs = await api(`/api/courses/${course}/documents`);
  $("docs").innerHTML = docs.length ? docs.map(d => {
    const ext = (d.name.split(".").pop() || "").slice(0, 4);
    return `<div class="doc"><div class="ext">${esc(ext)}</div>
      <div class="name"><div>${esc(d.name)}</div><div class="muted">${d.chunks} фрагм.${d.has_source ? "" : " · загружен старой версией: загрузите файл заново, чтобы пересобрать формулы"}</div></div>
      <div class="actions">
        <button class="btn ghost" data-view="${d.id}" title="Открыть">👁<span> Открыть</span></button>
        ${d.has_source ? `<button class="btn ghost" data-re="${d.id}" title="Пересобрать новым разбором">⟳<span> Пересобрать</span></button>` : ""}
        <button class="btn ghost" data-del="${d.id}" title="Удалить">✕<span> Удалить</span></button>
      </div></div>`;
  }).join("") : '<p class="muted" style="padding:14px 16px;margin:0">Пока пусто. Загрузите конспекты выше.</p>';
  document.querySelectorAll("[data-view]").forEach(b => b.onclick = async () => {
    const d = await api(`/api/documents/${b.dataset.view}`);
    $("viewer").innerHTML = `<div class="card viewer"><div class="muted" style="margin-bottom:8px">${esc(d.name)}</div>${markdownView(d.markdown)}</div>`;
    $("viewer").scrollIntoView({ behavior: "smooth" });
  });
  document.querySelectorAll("[data-re]").forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { const r = await api(`/api/documents/${b.dataset.re}/reprocess`, { method: "POST" }); $("uploadMsg").textContent = `Пересобрано: ${r.chunks} фрагм., новых карточек ${r.cards.added}`; }
    catch (e) { $("uploadMsg").innerHTML = `<span class="err">${esc(e.message)}</span>`; }
    loadDocs(); refreshBadge();
  });
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    if (!confirm("Удалить документ и карточки из него?")) return;
    await api(`/api/documents/${b.dataset.del}`, { method: "DELETE" });
    $("viewer").innerHTML = "";
    loadDocs(); refreshBadge();
  });
  const syn = await api(`/api/courses/${course}/synonyms`);
  $("syn").value = syn.map(g => g.join(", ")).join("\n");
}
async function upload(files) {
  if (!files.length) return;
  const fd = new FormData();
  [...files].forEach(f => fd.append("files", f));
  $("uploadMsg").textContent = "Загружаю и разбираю…";
  try {
    const r = await api(`/api/courses/${course}/documents`, { method: "POST", body: fd });
    $("uploadMsg").innerHTML = r.files.map(f => f.error ? `<span class="err">${esc(f.name)}: ${esc(f.error)}</span>`
      : `${esc(f.name)}: ${f.reprocessed ? "пересобран, " + f.chunks + " фрагм." : f.duplicate ? "уже загружен" : f.chunks + " фрагм."}`).join("<br>") +
      (r.cards ? `<br>новых карточек: ${r.cards.added}` : "");
    loadDocs(); refreshBadge();
  } catch (e) { $("uploadMsg").innerHTML = `<span class="err">${esc(e.message)}</span>`; }
}
$("files").onchange = e => { upload(e.target.files); e.target.value = ""; };
const drop = $("drop");
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); upload(e.dataTransfer.files); };
$("saveSyn").onclick = async () => {
  const groups = $("syn").value.split("\n").map(l => l.split(",").map(s => s.trim()).filter(Boolean)).filter(g => g.length > 1);
  const saved = await api(`/api/courses/${course}/synonyms`, { method: "PUT", body: JSON.stringify({ groups }) });
  $("synMsg").textContent = `сохранено групп: ${saved.length}`;
};

loadCourses();
</script>
