<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>study-rag</title>
<style>
  :root { --bg:#faf9f7; --fg:#1c1b19; --muted:#77736c; --line:#e7e4de; --card:#fff; --accent:#4338ca; --soft:#eef0ff; --ok:#15803d; --bad:#b91c1c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121212; --fg:#ecebe8; --muted:#a19d96; --line:#2a2928; --card:#1a1a19; --accent:#a5b4fc; --soft:#23253a; --ok:#4ade80; --bad:#f87171; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:820px; margin:0 auto; padding:28px 16px 80px; }
  header { display:flex; gap:12px; align-items:center; flex-wrap:wrap; justify-content:space-between; }
  h1 { font-size:20px; margin:0; }
  select, input, textarea { padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); font:inherit; }
  button { padding:8px 14px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); font:inherit; cursor:pointer; }
  button.primary { background:var(--fg); color:var(--bg); border-color:var(--fg); }
  button:disabled { opacity:.5; cursor:default; }
  nav { display:flex; gap:4px; margin:20px 0 16px; border-bottom:1px solid var(--line); overflow-x:auto; }
  nav button { border:none; border-bottom:2px solid transparent; border-radius:0; background:none; color:var(--muted); padding:8px 12px; white-space:nowrap; }
  nav button.on { color:var(--fg); border-bottom-color:var(--fg); }
  .badge { display:inline-block; min-width:18px; padding:0 6px; border-radius:99px; background:var(--accent); color:var(--bg); font-size:12px; margin-left:4px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .row { display:flex; gap:8px; }
  .row > input { flex:1; }
  .muted { color:var(--muted); font-size:13px; }
  .answer { margin-top:16px; font-size:16px; }
  .cite { display:inline-block; padding:0 5px; margin:0 1px; border-radius:4px; background:var(--soft); color:var(--accent); font-size:12px; cursor:pointer; vertical-align:1px; }
  .src { margin-top:10px; padding:10px 12px; border-left:3px solid var(--line); font-size:14px; }
  .src.hl { border-color:var(--accent); background:var(--soft); }
  .src b { font-weight:600; }
  .warn { color:var(--bad); font-size:13px; margin-top:8px; }
  .flash { min-height:220px; display:flex; flex-direction:column; justify-content:center; text-align:center; gap:12px; }
  .flash .front { font-size:20px; font-weight:600; }
  .flash .back { font-size:16px; }
  .grades { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; margin-top:12px; }
  .grades button small { display:block; color:var(--muted); font-size:12px; }
  .opt { display:block; width:100%; text-align:left; margin-top:8px; }
  .opt.right { border-color:var(--ok); color:var(--ok); }
  .opt.wrong { border-color:var(--bad); color:var(--bad); }
  .doc { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); gap:8px; }
  .doc:last-child { border-bottom:none; }
  .drop { border:2px dashed var(--line); border-radius:10px; padding:24px; text-align:center; color:var(--muted); cursor:pointer; }
  .drop.over { border-color:var(--accent); color:var(--accent); }
  pre { white-space:pre-wrap; font:13px/1.5 ui-monospace, Consolas, monospace; max-height:360px; overflow:auto; background:var(--bg); padding:12px; border-radius:8px; }
  textarea { width:100%; min-height:90px; }
  .stats { display:flex; gap:16px; flex-wrap:wrap; font-size:13px; color:var(--muted); margin-bottom:12px; }
  .stats b { color:var(--fg); }
  .hidden { display:none !important; }
  kbd { font:12px ui-monospace, monospace; border:1px solid var(--line); border-radius:4px; padding:0 4px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Конспекты</h1>
    <div class="row">
      <select id="course"></select>
      <button id="newCourse" title="Новый курс">+ курс</button>
    </div>
  </header>

  <nav>
    <button data-tab="ask" class="on">Спросить</button>
    <button data-tab="review">Повторение<span class="badge hidden" id="dueBadge"></span></button>
    <button data-tab="quiz">Квиз</button>
    <button data-tab="docs">Материалы</button>
  </nav>

  <section id="tab-ask">
    <form class="row" id="askForm">
      <input id="q" placeholder="Например: почему нельзя KFold на временных рядах?" autocomplete="off">
      <button class="primary">Спросить</button>
    </form>
    <div id="answer"></div>
  </section>

  <section id="tab-review" class="hidden">
    <div class="stats" id="stats"></div>
    <div class="card flash" id="flash"></div>
    <div class="grades hidden" id="grades">
      <button data-g="0">Не помню<small>10 мин</small></button>
      <button data-g="1">Трудно<small id="g1"></small></button>
      <button data-g="2">Хорошо<small id="g2"></small></button>
      <button data-g="3">Легко<small id="g3"></small></button>
    </div>
    <p class="muted" style="text-align:center"><kbd>пробел</kbd> показать ответ · <kbd>1</kbd>–<kbd>4</kbd> оценка</p>
  </section>

  <section id="tab-quiz" class="hidden">
    <div class="card" id="quiz"></div>
  </section>

  <section id="tab-docs" class="hidden">
    <label class="drop" id="drop">Перетащите конспекты сюда или нажмите, чтобы выбрать<br><span class="muted">.md, .txt, .docx, .pdf</span>
      <input type="file" id="files" multiple accept=".md,.txt,.docx,.pdf" class="hidden">
    </label>
    <div id="uploadMsg" class="muted" style="margin-top:8px"></div>
    <div class="card" style="margin-top:16px" id="docs"></div>
    <div id="viewer"></div>
    <h3 style="font-size:15px;margin-top:28px">Синонимы курса</h3>
    <p class="muted">По одной группе на строку, через запятую. Например: <i>матожидание, среднее, E[X]</i>. Поиск будет считать их одним словом.</p>
    <textarea id="syn"></textarea>
    <button id="saveSyn" style="margin-top:8px">Сохранить</button> <span class="muted" id="synMsg"></span>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api = async (url, opts = {}) => {
  const r = await fetch(url, { headers: opts.body && !(opts.body instanceof FormData) ? { "Content-Type": "application/json" } : {}, ...opts });
  if (r.status === 204) return null;
  const d = await r.json();
  if (!r.ok) throw new Error(typeof d.detail === "string" ? d.detail : "ошибка запроса");
  return d;
};
let course = null, tab = "ask", queue = [], cur = null, shown = false;

// --- курсы и вкладки
async function loadCourses(select) {
  const cs = await api("/api/courses");
  $("course").innerHTML = cs.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join("");
  course = select ?? (cs.find(c => String(c.id) === localStorageGet("course"))?.id) ?? cs[0]?.id;
  $("course").value = course;
  refreshBadge();
  openTab(tab);
}
function localStorageGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function localStorageSet(k, v) { try { localStorage.setItem(k, v); } catch {} }

$("course").onchange = () => { course = +$("course").value; localStorageSet("course", course); $("answer").innerHTML = ""; refreshBadge(); openTab(tab); };
$("newCourse").onclick = async () => {
  const name = prompt("Название курса");
  if (!name) return;
  try { const r = await api("/api/courses", { method: "POST", body: JSON.stringify({ name }) }); await loadCourses(r.id); openTab("docs"); }
  catch (e) { alert(e.message); }
};
document.querySelectorAll("nav button").forEach(b => b.onclick = () => openTab(b.dataset.tab));
function openTab(t) {
  tab = t;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  document.querySelectorAll("section").forEach(s => s.classList.toggle("hidden", s.id !== "tab-" + t));
  if (t === "review") startReview();
  if (t === "quiz") startQuiz();
  if (t === "docs") loadDocs();
  if (t === "ask") $("q").focus();
}
async function refreshBadge() {
  if (!course) return;
  const p = await api(`/api/courses/${course}/progress`);
  $("dueBadge").textContent = p.due;
  $("dueBadge").classList.toggle("hidden", !p.due);
  return p;
}

// --- вопрос
$("askForm").onsubmit = async e => {
  e.preventDefault();
  const question = $("q").value.trim();
  if (!question) return;
  $("answer").innerHTML = '<p class="muted">Ищу в конспектах…</p>';
  try {
    const a = await api(`/api/courses/${course}/ask`, { method: "POST", body: JSON.stringify({ question }) });
    const text = esc(a.text).replace(/\[(\d+)\]/g, '<span class="cite" data-n="$1">$1</span>');
    const mode = { llm: "ответ LLM по конспекту", extractive: "дословно из конспекта", none: "" }[a.mode];
    $("answer").innerHTML = `<div class="card answer">${text}${mode ? `<div class="muted" style="margin-top:6px">${mode}</div>` : ""}
      ${a.warnings.map(w => `<div class="warn">${esc(w)}</div>`).join("")}</div>
      ${a.mode !== "none" ? a.sources.map(s => `<div class="src" id="src-${s.n}"><b>[${s.n}] ${esc(s.section)}</b> <span class="muted">· ${esc(s.source)}</span><div>${esc(s.text)}</div></div>`).join("") : ""}`;
    document.querySelectorAll(".cite").forEach(c => c.onclick = () => {
      document.querySelectorAll(".src").forEach(s => s.classList.remove("hl"));
      const el = $("src-" + c.dataset.n);
      if (el) { el.classList.add("hl"); el.scrollIntoView({ behavior: "smooth", block: "center" }); }
    });
  } catch (err) { $("answer").innerHTML = `<p class="warn">${esc(err.message)}</p>`; }
};

// --- повторение
function nextInterval(c, g) {
  if (c.reps === 0) return [1, 1, 3][g - 1];
  if (c.reps === 1) return [2, 3, 5][g - 1];
  const ease = Math.max(1.3, c.ease + [-0.15, 0, 0.15][g - 1]);
  return Math.round(Math.max(c.interval + 1, c.interval * [1.2, ease, ease * 1.3][g - 1]));
}
const days = d => d === 1 ? "1 день" : d < 5 ? `${d} дня` : `${d} дней`;
async function startReview() {
  const p = await refreshBadge();
  $("stats").innerHTML = `<span>новых <b>${p.new}</b></span><span>изучаю <b>${p.learning}</b></span><span>выучено <b>${p.mature}</b></span>` +
    (p.reviews_7d ? `<span>за неделю: ${p.reviews_7d} повторений, вспомнил <b>${Math.round(p.recall_7d * 100)}%</b></span>` : "");
  queue = await api(`/api/courses/${course}/cards?due=true&limit=50`);
  showCard();
}
function showCard() {
  cur = queue.shift();
  shown = false;
  $("grades").classList.add("hidden");
  if (!cur) { $("flash").innerHTML = `<div class="front">На сегодня всё 🎉</div><div class="muted">Новые карточки появятся, когда подойдёт время повторения.</div>`; return; }
  $("flash").innerHTML = `<div class="front">${esc(cur.front)}</div><div><button id="show">Показать ответ</button></div>`;
  $("show").onclick = reveal;
}
function reveal() {
  if (!cur || shown) return;
  shown = true;
  $("flash").innerHTML = `<div class="muted">${esc(cur.front)}</div><div class="back">${esc(cur.back)}</div>`;
  [1, 2, 3].forEach(g => $("g" + g).textContent = days(nextInterval(cur, g)));
  $("grades").classList.remove("hidden");
}
async function grade(g) {
  if (!cur || !shown) return;
  const updated = await api(`/api/cards/${cur.id}/review`, { method: "POST", body: JSON.stringify({ grade: g }) });
  if (g === 0) queue.push(updated);  // забытая карточка вернётся в конце сессии
  refreshBadge();
  showCard();
}
document.querySelectorAll("#grades button").forEach(b => b.onclick = () => grade(+b.dataset.g));
document.addEventListener("keydown", e => {
  if (tab !== "review" || e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if (e.code === "Space") { e.preventDefault(); reveal(); }
  if (["1", "2", "3", "4"].includes(e.key)) grade(+e.key - 1);
});

// --- квиз
let quizItems = [], qi = 0, score = 0;
async function startQuiz() {
  quizItems = await api(`/api/courses/${course}/quiz?n=10`);
  qi = 0; score = 0;
  if (!quizItems.length) { $("quiz").innerHTML = '<p class="muted">Для квиза нужно хотя бы 4 определения в конспектах.</p>'; return; }
  showQuestion();
}
function showQuestion() {
  if (qi >= quizItems.length) {
    $("quiz").innerHTML = `<div class="front" style="font-size:20px">${score} из ${quizItems.length}</div><button id="again" style="margin-top:12px">Ещё раз</button>`;
    $("again").onclick = startQuiz;
    return;
  }
  const it = quizItems[qi];
  $("quiz").innerHTML = `<div class="muted">Вопрос ${qi + 1} из ${quizItems.length}</div><p style="font-size:16px">${esc(it.prompt)}</p>` +
    it.options.map((o, i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join("");
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    document.querySelectorAll(".opt").forEach(x => { x.disabled = true; if (+x.dataset.i === it.answer) x.classList.add("right"); });
    if (i === it.answer) score++; else b.classList.add("wrong");
    setTimeout(() => { qi++; showQuestion(); }, i === it.answer ? 700 : 1600);
  });
}

// --- материалы
async function loadDocs() {
  const docs = await api(`/api/courses/${course}/documents`);
  $("docs").innerHTML = docs.length ? docs.map(d => `<div class="doc"><span>${esc(d.name)} <span class="muted">· ${d.chunks} фрагм.</span></span>
    <span><button data-view="${d.id}">Открыть</button> <button data-del="${d.id}">Удалить</button></span></div>`).join("")
    : '<p class="muted">Пока пусто. Загрузите конспекты выше.</p>';
  document.querySelectorAll("[data-view]").forEach(b => b.onclick = async () => {
    const d = await api(`/api/documents/${b.dataset.view}`);
    $("viewer").innerHTML = `<h3 style="font-size:15px">${esc(d.name)}</h3><pre>${esc(d.markdown)}</pre>`;
  });
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    if (!confirm("Удалить документ и карточки из него?")) return;
    await api(`/api/documents/${b.dataset.del}`, { method: "DELETE" });
    $("viewer").innerHTML = "";
    loadDocs(); refreshBadge();
  });
  const syn = await api(`/api/courses/${course}/synonyms`);
  $("syn").value = syn.map(g => g.join(", ")).join("\n");
}
async function upload(files) {
  if (!files.length) return;
  const fd = new FormData();
  [...files].forEach(f => fd.append("files", f));
  $("uploadMsg").textContent = "Загружаю…";
  try {
    const r = await api(`/api/courses/${course}/documents`, { method: "POST", body: fd });
    $("uploadMsg").innerHTML = r.files.map(f => f.error ? `<span class="warn">${esc(f.name)}: ${esc(f.error)}</span>`
      : `${esc(f.name)}: ${f.duplicate ? "уже загружен" : f.chunks + " фрагм."}`).join("<br>") +
      (r.cards ? `<br>новых карточек: ${r.cards.added}` : "");
    loadDocs(); refreshBadge();
  } catch (e) { $("uploadMsg").innerHTML = `<span class="warn">${esc(e.message)}</span>`; }
}
$("files").onchange = e => { upload(e.target.files); e.target.value = ""; };
const drop = $("drop");
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); upload(e.dataTransfer.files); };
$("saveSyn").onclick = async () => {
  const groups = $("syn").value.split("\n").map(l => l.split(",").map(s => s.trim()).filter(Boolean)).filter(g => g.length > 1);
  const saved = await api(`/api/courses/${course}/synonyms`, { method: "PUT", body: JSON.stringify({ groups }) });
  $("synMsg").textContent = `сохранено групп: ${saved.length}`;
};

loadCourses();
</script>
</body>
</html>
